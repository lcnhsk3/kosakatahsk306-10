        // ============================================================
        //  STORAGE — TANDAI KATA
        // ============================================================
        const STORAGE_KEY = 'hsk3_bab6_10_marked_words_v1';

        try {

            if (Array.isArray(saved)) markedSet = new Set(saved);
        } catch (e) { markedSet = new Set(); }

        function wordKey(w) { return `L${w.lesson}::${w.hanzi}`; }
        function isMarked(w) { return markedSet.has(wordKey(w)); }
        function saveMarks() {
            try { localStorage.setItem(STORAGE_KEY, JSON.stringify(Array.from(markedSet))); } catch (e) {}
        }
        function toggleMarkOn(w) {
            const key = wordKey(w);
            if (markedSet.has(key)) markedSet.delete(key);
            else markedSet.add(key);
            saveMarks();
        }
        function getMarkedWords() {
            return baseData.filter(w => markedSet.has(wordKey(w)));
        }

        const lessonTitles = {

        const byLesson = {};

            byLesson[w.lesson].push(w);
        });

        const packages = [];
        Object.keys(byLesson).map(Number).sort((a, b) => a - b).forEach(num => {
            packages.push({
                code: `BAB-${String(num).padStart(2, '0')}`,
                title: lessonTitles[num] || `BAB ${num}`,
                words: byLesson[num],
                type: 'lesson'
            });
        });

        const MARK_PACKAGE_INDEX = packages.length;
        packages.push({
            code: '★',
            title: 'Kata yang Ditandai',
            words: [],
            type: 'marked'
        });

        const ALL_PACKAGE_INDEX = packages.length;
        packages.push({
            code: 'ALL',
            title: `📚 SEMUA KOSAKATA`,
            words: [...baseData],
            type: 'all'

        // ============================================================

        // ============================================================
        let currentPackageIndex = ALL_PACKAGE_INDEX;

        const cardFlipper = document.getElementById('cardFlipper');

        const contohPinyin = document.getElementById('contohPinyin');
        const contohArti = document.getElementById('contohArti');
        const navCounter = document.getElementById('navCounter');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const randomBtn = document.getElementById('randomBtn');
        const packageSelect = document.getElementById('packageSelect');
        const packageCode = document.getElementById('packageCode');
        const pkgPrev = document.getElementById('pkgPrev');
        const pkgNext = document.getElementById('pkgNext');
        const markBtn = document.getElementById('markBtn');
        const markBadge = document.getElementById('markBadge');
        const markFilterBtn = document.getElementById('markFilterBtn');
        const markCountEl = document.getElementById('markCount');

        // ============================================================
        //  RENDER
        // ============================================================
        function renderCard(index) {
            const data = currentData[index];
            if (!data) {
                hanziDisplay.textContent = '—';
                frontIndex.textContent = '0 / 0';
                navCounter.textContent = '0 / 0';
                pinyinDisplay.textContent = '';
                artiDisplay.textContent = '';
                contohHanzi.textContent = '';
                contohPinyin.textContent = '';
                contohArti.textContent = '';
                markBtn.textContent = '☆';
                markBtn.classList.remove('marked');
                cardFront.classList.remove('is-marked');
                markBadge.style.display = 'none';
                prevBtn.disabled = true;
                nextBtn.disabled = true;
                return;
            }
            const total = currentData.length;

            hanziDisplay.textContent = data.hanzi;
            frontIndex.textContent = `${index + 1} / ${total}`;
            pinyinDisplay.textContent = data.pinyin;
            artiDisplay.textContent = data.arti;

            const target = data.hanzi;
            let contohHtml = data.contoh;
            if (target && contohHtml) {
                try {
                    const escaped = target.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                    const regex = new RegExp(escaped, 'g');
                    contohHtml = contohHtml.replace(regex, '<span class="highlight-word">' + target + '</span>');
                } catch (err) {}
            }
            contohHanzi.innerHTML = contohHtml;
            contohPinyin.textContent = data.contohPinyin;
            contohArti.textContent = data.contohArti;

            navCounter.textContent = `${index + 1} / ${total}`;
            prevBtn.disabled = (index === 0);
            nextBtn.disabled = (index === total - 1);

            const marked = isMarked(data);
            markBtn.textContent = marked ? '★' : '☆';
            markBtn.classList.toggle('marked', marked);
            cardFront.classList.toggle('is-marked', marked);
            markBadge.style.display = marked ? 'block' : 'none';

            if (isFlipped) {
                cardFlipper.classList.remove('flipped');
                isFlipped = false;
            }
        }

        function goTo(index) {
            if (index < 0 || index >= currentData.length) return;
            currentIndex = index;
            renderCard(currentIndex);
        }
        function nextCard() { if (currentIndex < currentData.length - 1) goTo(currentIndex + 1); }
        function prevCard() { if (currentIndex > 0) goTo(currentIndex - 1); }

        // ============================================================
        //  SHUFFLE
        // ============================================================
        function shuffleArray(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                const tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
            }
            return arr;
        }
        function shuffleCards() {
            if (currentData.length < 2) return;
            shuffleArray(currentData);
            currentIndex = 0;
            renderCard(0);
        }

        // ============================================================
        //  LOAD PACKAGE
        // ============================================================
        function loadPackage(index) {
            if (index < 0 || index >= packages.length) return;
            currentPackageIndex = index;
            const pkg = packages[index];

            if (pkg.type === 'marked') {
                currentData = getMarkedWords();
                if (currentData.length === 0) {
                    currentData = [];
                    currentIndex = 0;
                    isFlipped = false;
                    cardFlipper.classList.remove('flipped');
                    renderCard(0);
                    packageSelect.value = String(currentPackageIndex);
                    packageCode.textContent = pkg.code;
                    pkgPrev.disabled = (currentPackageIndex === 0);
                    pkgNext.disabled = (currentPackageIndex === packages.length - 1);
                    return;
                }
            } else {
                currentData = pkg.words.slice();
            }

            shuffleArray(currentData);
            currentIndex = 0;
            isFlipped = false;
            cardFlipper.classList.remove('flipped');
            renderCard(0);

            packageSelect.value = String(currentPackageIndex);
            packageCode.textContent = pkg.code;
            pkgPrev.disabled = (currentPackageIndex === 0);
            pkgNext.disabled = (currentPackageIndex === packages.length - 1);
        }

            markCountEl.textContent = count;
            const markOpt = packageSelect.querySelector(`option[value="${MARK_PACKAGE_INDEX}"]`);
            if (markOpt) {
                markOpt.textContent = `★ TANDAI · Kata yang Ditandai (${count})`;
            }
            markFilterBtn.classList.toggle('active', currentPackageIndex === MARK_PACKAGE_INDEX);
        }

            const data = currentData[currentIndex];
            if (!data) return;
            const marked = isMarked(data);
            markBtn.textContent = marked ? '★' : '☆';
            markBtn.classList.toggle('marked', marked);
            cardFront.classList.toggle('is-marked', marked);
            markBadge.style.display = marked ? 'block' : 'none';
        }

        function onToggleMark() {
            const data = currentData[currentIndex];
            if (!data) return;
            const wasMarked = isMarked(data);
            toggleMarkOn(data);

            if (currentPackageIndex === MARK_PACKAGE_INDEX) {
                if (wasMarked) {
                    currentData.splice(currentIndex, 1);
                    if (currentData.length === 0) {
                        updateMarkCountUI();
                        renderCard(0);
                        navCounter.textContent = `0 / 0`;
                        frontIndex.textContent = `0 / 0`;
                        prevBtn.disabled = true;
                        nextBtn.disabled = true;
                        return;
                    }
                    if (currentIndex >= currentData.length) {
                        currentIndex = currentData.length - 1;
                    }
                    renderCard(currentIndex);
                } else {
                    refreshCurrentCardMarkUI();
                }
            } else {
                refreshCurrentCardMarkUI();
            }
            updateMarkCountUI();
        }

        // ============================================================
        //  FLIP
        // ============================================================
        function toggleFlip(e) {
            if (e.target.closest('.nav-btn') || e.target.closest('.nav-bar') ||
                e.target.closest('.package-select') || e.target.closest('.package-row') ||
                e.target.closest('.package-btn') || e.target.closest('.mark-btn')) return;
            cardFlipper.classList.toggle('flipped');
            isFlipped = !isFlipped;
        }

        // ============================================================
        //  KEYBOARD
        // ============================================================
        function handleKeydown(e) {
            if (e.key === 'ArrowRight') { e.preventDefault(); nextCard(); }
            else if (e.key === 'ArrowLeft') { e.preventDefault(); prevCard(); }
            else if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); toggleFlip(e); }
            else if (e.key === 'm' || e.key === 'M') { e.preventDefault(); onToggleMark(); }
        }

        // ============================================================
        //  DISABLE FUNCTIONS
        // ============================================================
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('selectstart', e => e.preventDefault());
        document.addEventListener('copy', e => e.preventDefault());
        document.addEventListener('cut', e => e.preventDefault());
        document.addEventListener('dragstart', e => e.preventDefault());
        document.addEventListener('keydown', (e) => {
            if (
                (e.ctrlKey && ['c','C','x','X','a','A','u','U','s','S','p','P'].indexOf(e.key) !== -1) ||
                e.key === 'F12' ||
                (e.ctrlKey && e.key === 'F12') ||
                (e.ctrlKey && e.shiftKey && ['I','i','J','j','C','c'].indexOf(e.key) !== -1) ||
                e.key === 'PrintScreen'
            ) {
                e.preventDefault();
                return false;
            }
        }, true);

        // ============================================================
        //  INIT
        // ============================================================
        packages.forEach((pkg, i) => {
            const opt = document.createElement('option');
            opt.value = String(i);
            if (pkg.type === 'marked') {
                opt.textContent = `★ TANDAI · Kata yang Ditandai (0)`;
            } else {
                opt.textContent = `${pkg.code} · ${pkg.title} (${pkg.words.length})`;
            }
            packageSelect.appendChild(opt);
        });

        packageSelect.addEventListener('change', (e) => {
            loadPackage(parseInt(e.target.value, 10));
        });
        pkgPrev.addEventListener('click', (e) => {
            e.stopPropagation();
            if (currentPackageIndex > 0) loadPackage(currentPackageIndex - 1);
        });
        pkgNext.addEventListener('click', (e) => {
            e.stopPropagation();
            if (currentPackageIndex < packages.length - 1) loadPackage(currentPackageIndex + 1);
        });

        markBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            onToggleMark();
        });

        markFilterBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (currentPackageIndex === MARK_PACKAGE_INDEX) {
                loadPackage(ALL_PACKAGE_INDEX);
            } else {
                loadPackage(MARK_PACKAGE_INDEX);
            }
        });

        cardWrapper.addEventListener('click', toggleFlip);
        prevBtn.addEventListener('click', (e) => { e.stopPropagation(); prevCard(); });
        nextBtn.addEventListener('click', (e) => { e.stopPropagation(); nextCard(); });
        randomBtn.addEventListener('click', (e) => { e.stopPropagation(); shuffleCards(); });
        document.addEventListener('keydown', handleKeydown);

        updateMarkCountUI();
        loadPackage(ALL_PACKAGE_INDEX);

        // ============================================================
        //  SWIPE
        // ============================================================
        let touchStartX = 0;
        let touchStartY = 0;
        cardWrapper.addEventListener('touchstart', (e) => {
            const touch = e.touches[0];
            touchStartX = touch.clientX;
            touchStartY = touch.clientY;
        }, { passive: true });

        cardWrapper.addEventListener('touchend', (e) => {
            if (touchStartX === 0) return;
            const touchEnd = e.changedTouches[0];
            const deltaX = touchEnd.clientX - touchStartX;
            const deltaY = touchEnd.clientY - touchStartY;
            if (Math.abs(deltaX) > Math.abs(deltaY) && Math.abs(deltaX) > 40) {
                if (deltaX < 0) nextCard();
                else prevCard();
            }
            touchStartX = 0;
            touchStartY = 0;
        }, { passive: true });

        console.log(`✅ HSK3 BAB 6-10 — ${packages.length} paket siap!`);
        console.log(`📚 Total kosakata: ${baseData.length}`);
        console.log(`★ Fitur tandai: klik bintang di kiri atas kartu (shortcut: M)`);
    </script>

</body>
</html>
